# Uploads this repository to a Hugging Face Space on every push to main.
# Setup (once, in GitHub repository settings > Secrets and variables > Actions):
#   Secrets   -> HF_TOKEN     a Hugging Face access token with write permission
#   Variables -> HF_SPACE_ID  the Space id, in the form <hf-username>/<space-name>
# Results and any error are shown as annotations on the run's summary page.
name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install huggingface_hub
        run: python -m pip install --quiet huggingface_hub==2.3.0
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: python .github/scripts/sync_to_space.py
