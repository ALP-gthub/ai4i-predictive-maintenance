# Publishes to Hugging Face on every push to main:
#   docs/  -> a static Space (the browser demo)
#   model/ -> a model repository (model file and model card)
# Setup (once, in GitHub repository settings > Secrets and variables > Actions):
#   Secrets   -> HF_TOKEN     a Hugging Face access token with write permission
#   Variables -> HF_SPACE_ID  the Space id, in the form <hf-username>/<space-name>
#   Variables -> HF_MODEL_ID  optional, default <hf-username>/ai4i-failure-prediction-model
# Results and any error are shown as annotations on the run's summary page.
name: Publish to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install huggingface_hub
        run: python -m pip install --quiet huggingface_hub==2.3.0
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_MODEL_ID: ${{ vars.HF_MODEL_ID }}
        run: python .github/scripts/publish_to_hf.py
